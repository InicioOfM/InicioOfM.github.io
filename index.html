<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bienvenida</title>
  <style>
    body {
      margin: 0;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: radial-gradient(circle at center, #1a1a1a, #0d0d0d);
      font-family: 'Playfair Display', serif;
      color: #fff;
      overflow: hidden;
      text-align: center;
    }

    .container {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 24px;
      animation: fadeIn 2s ease;
    }

    h1 {
      font-size: 38px;
      font-weight: 400;
      margin: 0;
      background: linear-gradient(90deg, #ff9a9e, #fad0c4, #fcb69f);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      animation: glow 3s ease-in-out infinite alternate;
    }

    p {
      font-size: 16px;
      opacity: 0.85;
      max-width: 320px;
      margin: 0 auto;
    }

    #start-btn {
      font-size: 20px;
      padding: 14px 42px;
      border: none;
      border-radius: 999px;
      cursor: pointer;
      color: #fff;
      background: linear-gradient(90deg, #ff758c, #ff7eb3);
      background-size: 200% 200%;
      animation: gradientMove 5s ease infinite, pulse 2s infinite;
      box-shadow: 0 8px 26px rgba(255, 120, 150, 0.4);
      transition: transform 0.3s ease;
    }

    #start-btn:hover {
      transform: scale(1.08);
    }

    @keyframes gradientMove {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }

    @keyframes pulse {
      0%, 100% { box-shadow: 0 0 18px rgba(255, 140, 180, 0.6); }
      50% { box-shadow: 0 0 36px rgba(255, 140, 180, 0.9); }
    }

    @keyframes glow {
      from { text-shadow: 0 0 10px rgba(255, 200, 210, 0.4); }
      to   { text-shadow: 0 0 20px rgba(255, 200, 210, 0.8); }
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Un momento especial comienza aquí</h1>
    <p>Haz click para descubrir lo que te preparé con todo mi corazón 💖</p>
    <button id="start-btn">Entrar</button>
  </div>

  <script>
    document.getElementById("start-btn").addEventListener("click", () => {
      window.location.href = "contador.html";
    });
  </script>
</body>
</html>
